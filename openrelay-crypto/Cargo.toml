[package]
name = "openrelay-crypto"
version.workspace = true
edition.workspace = true

[dependencies]
blake3 = "1.5"
ed25519-dalek = "2.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
hex = "0.4"
